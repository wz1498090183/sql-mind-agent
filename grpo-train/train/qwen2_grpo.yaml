### model
model_name_or_path: ./models/models/qwen--Qwen2.5-Coder-3B-Instruct
quantization_bit: 4
quantization_method: bnb
double_quantization: false
trust_remote_code: true
### method
stage: grpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
reward_funcs: train.reward_sql

### dataset
dataset: spider_complex
template: qwen
cutoff_len: 1536                # 保留较长输入，适配长Schema
max_samples: 15
preprocessing_num_workers: 16
dataloader_num_workers: 4
### output
output_dir: saves/Qwen2.5-Coder/grpo/sql
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]
### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
### generation（GRPO 在线采样参数）
max_new_tokens: 512
temperature: 0.9
top_p: 0.9