name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # 后端代码与配置（pyproject.toml / requirements）都位于 backend/ 目录
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 单元测试（pytest）
        run: python -m pytest tests/ -q

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 类型检查（mypy）
        run: mypy app/
